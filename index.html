<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>A Map of Us</title>

  <!-- iOS / home-screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="A Map of Us">
  <meta name="theme-color" content="#F7F0E1">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="manifest" href="./manifest.json">

  <!-- Link previews. NOTE: og:image should be an ABSOLUTE url once deployed —
       see README "Before you send the link". -->
  <meta property="og:title" content="A Map of Us">
  <meta property="og:description" content="A little storybook map. Open it on your phone. ♥">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./images/og.png">

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/map.css">
  <link rel="stylesheet" href="./css/ui.css">
</head>
<body class="phase-title">
<div id="stage">

  <!-- ═══════════════════════════════════════════════════════════════════
       THE MAP.
       Hand-drawn storybook world. Everything inside #world rides the
       camera (a CSS transform animated by js/map.js). Pins and route
       lines are generated by JS into #routes / #fx / #pins.
       Feel free to hand-edit the artwork below — coordinates are in the
       0–1000 × 0–700 viewBox space (chapters.js x/y percents map onto it:
       svgX = x * 10, svgY = y * 7).
       ═══════════════════════════════════════════════════════════════════ -->
  <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"
       aria-hidden="true" focusable="false" data-act="3">
    <defs>
      <radialGradient id="ocean-glow" cx="50%" cy="42%" r="75%">
        <stop offset="0%"  stop-color="#C3D8CD"/>
        <stop offset="100%" stop-color="#ABC6BA"/>
      </radialGradient>
      <radialGradient id="sicily-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#E8C67E" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#E8C67E" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g id="world">
      <!-- Ocean, oversized so extreme zoom-outs never show the void -->
      <rect id="ocean" x="-1400" y="-1200" width="3800" height="3200" fill="url(#ocean-glow)"/>

      <!-- ═══════ ACT 3 · THE WHOLE WORLD (continents) ═══════ -->
      <g id="act3-detail" class="act-detail">
        <!-- North America -->
        <path class="land land-wide" d="
          M 185 775
          C 160 700 150 640 138 600
          C 128 575 120 545 122 515
          C 124 490 112 470 103 448
          C 92 425 86 405 82 380
          C 72 340 80 300 68 268
          C 60 240 58 205 66 172
          C 74 140 88 108 108 80
          C 150 40 260 24 380 28
          C 500 34 570 62 585 130
          C 598 190 588 224 596 262
          C 604 302 590 332 560 352
          C 540 366 530 380 535 400
          C 540 425 528 446 505 452
          C 494 474 482 468 478 452
          C 468 430 445 424 420 434
          C 390 447 358 444 338 468
          C 308 504 280 540 255 590
          C 235 630 210 700 185 775 Z"/>
        <!-- Europe -->
        <path class="land land-wide" d="
          M 806 30
          C 770 60 752 110 764 150
          C 772 178 758 210 768 240
          C 776 266 796 280 818 272
          C 832 290 850 300 862 288
          C 878 296 900 298 916 288
          C 940 300 980 302 1020 292
          L 1020 30 Z"/>
        <!-- Italy (the boot) -->
        <path class="land land-wide" d="
          M 858 288
          C 850 306 856 326 868 344
          C 878 358 886 374 885 392
          C 884 404 892 410 903 408
          C 913 406 913 396 905 391
          C 897 386 893 376 895 366
          C 897 354 888 340 878 326
          C 870 314 866 300 870 290
          C 866 286 861 285 858 288 Z"/>
        <!-- Sicily -->
        <path id="sicily" class="land land-wide" d="
          M 856 432
          C 864 421 886 418 901 426
          C 913 432 912 446 899 452
          C 882 459 863 453 856 444
          C 853 440 853 436 856 432 Z"/>
        <!-- Africa (a warm hint at the bottom) -->
        <path class="land land-wide land-warm" d="
          M 774 520
          C 820 488 900 484 1020 502
          L 1020 780 L 790 780
          C 770 690 760 590 774 520 Z"/>
        <!-- a friendly sun -->
        <g class="sun" transform="translate(700, 70)">
          <circle r="20" fill="#E8C67E"/>
          <g class="sun-rays" stroke="#E8C67E" stroke-width="4" stroke-linecap="round">
            <line x1="0" y1="-30" x2="0" y2="-38"/><line x1="0" y1="30" x2="0" y2="38"/>
            <line x1="-30" y1="0" x2="-38" y2="0"/><line x1="30" y1="0" x2="38" y2="0"/>
            <line x1="-22" y1="-22" x2="-27" y2="-27"/><line x1="22" y1="22" x2="27" y2="27"/>
            <line x1="-22" y1="22" x2="-27" y2="27"/><line x1="22" y1="-22" x2="27" y2="-27"/>
          </g>
        </g>
        <!-- big ocean squiggles -->
        <g class="waves waves-wide">
          <path d="M 300 300 q 12 -9 24 0 q 12 9 24 0"/>
          <path d="M 420 420 q 12 -9 24 0 q 12 9 24 0"/>
          <path d="M 560 520 q 12 -9 24 0 q 12 9 24 0"/>
          <path d="M 660 330 q 12 -9 24 0 q 12 9 24 0"/>
          <path d="M 250 560 q 12 -9 24 0 q 12 9 24 0"/>
        </g>
        <text class="maplabel label-wide" x="330" y="380">the Pacific… wait, no —</text>
        <text class="maplabel label-wide" x="470" y="480">the Atlantic</text>
        <text class="maplabel label-wide" x="840" y="180">Europe</text>
        <text class="maplabel label-wide" x="836" y="490">Sicilia ♥</text>

        <!-- Sicily's warm welcome — hidden until the plane lands -->
        <g id="sicily-warm">
          <ellipse cx="880" cy="437" rx="70" ry="48" fill="url(#sicily-glow)"/>
          <g class="citrus" transform="translate(866,441)">
            <line x1="0" y1="0" x2="0" y2="-4" class="trunk"/>
            <g class="crown"><circle cy="-7" r="4.6" class="leaves"/>
              <circle cx="-2" cy="-8" r="1.1" class="orange"/><circle cx="2" cy="-6.4" r="1.1" class="orange"/><circle cx="0.4" cy="-9.6" r="1.1" class="orange"/></g>
          </g>
          <g class="citrus" transform="translate(890,444)">
            <line x1="0" y1="0" x2="0" y2="-4" class="trunk"/>
            <g class="crown"><circle cy="-7" r="4" class="leaves"/>
              <circle cx="-1.6" cy="-7.6" r="1" class="orange"/><circle cx="1.8" cy="-6" r="1" class="orange"/></g>
          </g>
          <g class="citrus" transform="translate(902,436)">
            <line x1="0" y1="0" x2="0" y2="-3.4" class="trunk"/>
            <g class="crown"><circle cy="-6" r="3.6" class="leaves"/>
              <circle cx="1.4" cy="-6.6" r="0.9" class="orange"/><circle cx="-1.4" cy="-5.4" r="0.9" class="orange"/></g>
          </g>
          <g id="boat" transform="translate(838,472)">
            <g class="boat-bob">
              <line x1="0" y1="-13" x2="0" y2="0" class="mast"/>
              <path class="sail" d="M 0 -13 C 1.4 -9.6 1.4 -5.4 0.6 -2.4 L 8.4 -2.4 C 6.4 -7 3.4 -10.6 0 -13 Z"/>
              <path class="hull" d="M -8 -1 C -5 4.4 5 4.4 8 -1 Z"/>
            </g>
          </g>
        </g>
      </g>

      <!-- ═══════ ACT 2 · SOUTHERN CALIFORNIA ═══════ -->
      <g id="act2-detail" class="act-detail">
        <path class="land-fill" d="
          M 205 736
          C 175 665 152 625 143 598
          C 134 578 127 559 127 537
          C 128 516 122 500 113 484
          C 105 469 99 453 101 437
          C 103 423 97 412 91 401
          C 87 393 85 386 86 379
          L 310 379
          C 306 500 292 620 262 736 Z"/>
        <path class="coastline coast-mid" d="
          M 205 736
          C 175 665 152 625 143 598
          C 134 578 127 559 127 537
          C 128 516 122 500 113 484
          C 105 469 99 453 101 437
          C 103 423 97 412 91 401
          C 87 393 85 386 86 379"/>
        <!-- inland hills -->
        <g class="hills">
          <path d="M 160 452 q 10 -13 20 0"/>
          <path d="M 178 460 q 10 -13 20 0"/>
          <path d="M 196 450 q 9 -12 18 0"/>
          <path d="M 172 520 q 10 -13 20 0"/>
          <path d="M 192 528 q 9 -12 18 0"/>
        </g>
        <!-- Los Angeles: a tiny skyline -->
        <g class="city" transform="translate(108,432)">
          <rect x="-6" y="-9" width="4" height="9" rx="1.4"/>
          <rect x="-1" y="-13" width="4.6" height="13" rx="1.4"/>
          <rect x="5" y="-7.6" width="4" height="7.6" rx="1.4"/>
        </g>
        <!-- Six Flags: a tiny rollercoaster in Valencia -->
        <g class="coaster" transform="translate(114,404)">
          <path class="track" d="M -12 3 C -8 -9 -3 -9 0 1 C 2 -7 7 -7 9 2 C 11 -4 15 -4 17 3"/>
          <line x1="-8" y1="3" x2="-8" y2="-3.4"/>
          <line x1="0" y1="3" x2="0" y2="1"/>
          <line x1="8" y1="3" x2="8" y2="-2.2"/>
          <circle class="cart" cx="-3.4" cy="-4.8" r="1.6"/>
        </g>
        <!-- Irvine: neat little rows of trees -->
        <g class="grove" transform="translate(136,487)">
          <g transform="translate(-7,0)"><line x1="0" y1="0" x2="0" y2="-3" class="trunk"/><circle cy="-5" r="2.6" class="leaves"/></g>
          <g transform="translate(0,1)"><line x1="0" y1="0" x2="0" y2="-3" class="trunk"/><circle cy="-5" r="2.6" class="leaves"/></g>
          <g transform="translate(7,0)"><line x1="0" y1="0" x2="0" y2="-3" class="trunk"/><circle cy="-5" r="2.6" class="leaves"/></g>
        </g>
        <!-- San Diego cluster (coarse, for when we're zoomed to SoCal) -->
        <g class="city" transform="translate(152,572)">
          <rect x="-5" y="-7" width="3.6" height="7" rx="1.2"/>
          <rect x="-0.4" y="-10" width="4" height="10" rx="1.2"/>
          <rect x="4.6" y="-6" width="3.4" height="6" rx="1.2"/>
        </g>
        <g class="waves waves-mid">
          <path d="M 74 480 q 6 -5 12 0 q 6 5 12 0"/>
          <path d="M 60 560 q 6 -5 12 0 q 6 5 12 0"/>
          <path d="M 92 620 q 6 -5 12 0 q 6 5 12 0"/>
          <path d="M 52 420 q 6 -5 12 0 q 6 5 12 0"/>
        </g>
        <text class="maplabel label-mid" x="128" y="424">Los Angeles</text>
        <text class="maplabel label-mid" x="109" y="390">Valencia!</text>
        <text class="maplabel label-mid" x="146" y="479">Irvine</text>
        <text class="maplabel label-mid" x="160" y="590">San Diego</text>
      </g>

      <!-- ═══════ ACT 4 · UP THE COAST (Bay Area) ═══════ -->
      <g id="act4-detail" class="act-detail">
        <path class="land-fill" d="
          M 86 379
          C 80 358 76 336 79 314
          C 82 292 74 276 70 258
          C 66 240 64 214 70 188
          C 76 160 84 130 96 104
          C 100 88 102 72 102 58
          L 312 58 L 310 379 Z"/>
        <path class="coastline coast-mid" d="
          M 86 379
          C 80 358 76 336 79 314
          C 82 292 74 276 70 258
          C 66 240 64 214 70 188
          C 76 160 84 130 96 104
          C 100 88 102 72 102 58"/>
        <!-- the Bay -->
        <path class="bay-water" d="
          M 66 254
          C 74 247 84 250 84 260
          C 84 272 76 279 68 273
          C 62 268 61 259 66 254 Z"/>
        <!-- a tiny Golden Gate -->
        <g class="gate" transform="translate(64,250)">
          <line x1="0" y1="0" x2="0" y2="-6"/>
          <line x1="7" y1="2" x2="7" y2="-4"/>
          <path d="M 0 -6 C 2.4 -2.4 4.6 -2.4 7 -4" fill="none"/>
          <path d="M 0 -1 L 7 1" fill="none"/>
        </g>
        <!-- redwoods up north -->
        <g class="redwoods" transform="translate(92,150)">
          <path d="M 0 0 C -3 -2 -2.4 -7 0 -11 C 2.4 -7 3 -2 0 0 Z"/>
          <path d="M 8 3 C 5 1 5.6 -5 8 -9 C 10.4 -5 11 1 8 3 Z"/>
          <path d="M -7 4 C -10 2 -9.4 -3 -7 -7 C -4.6 -3 -4 2 -7 4 Z"/>
        </g>
        <g class="hills">
          <path d="M 120 220 q 10 -13 20 0"/>
          <path d="M 138 228 q 10 -13 20 0"/>
          <path d="M 116 300 q 10 -13 20 0"/>
        </g>
        <g class="waves waves-mid">
          <path d="M 44 300 q 6 -5 12 0 q 6 5 12 0"/>
          <path d="M 40 180 q 6 -5 12 0 q 6 5 12 0"/>
        </g>
        <text class="maplabel label-mid" x="90" y="238">San Francisco</text>
        <text class="maplabel label-mid" x="104" y="290">the Bay</text>
      </g>

      <!-- ═══════ ACT 1 · SAN DIEGO, UP CLOSE ═══════ -->
      <g id="act1-detail" class="act-detail">
        <path class="land-fill" d="
          M 152 692
          C 146 664 141 640 140 618
          C 139 604 135 594 131 585
          C 127 575 126 564 129 554
          C 132 545 130 536 127 528
          C 124 519 125 509 129 500
          C 132 493 131 484 128 476
          C 126 469 127 462 130 456
          L 268 456 L 268 692 Z"/>
        <path class="coastline coast-fine" d="
          M 152 692
          C 146 664 141 640 140 618
          C 139 604 135 594 131 585
          C 127 575 126 564 129 554
          C 132 545 130 536 127 528
          C 124 519 125 509 129 500
          C 132 493 131 484 128 476
          C 126 469 127 462 130 456"/>
        <!-- San Diego Bay (water between Point Loma / Coronado and downtown) -->
        <path class="bay-water" d="
          M 137 560
          C 144 558 150 561 152 567
          C 154 573 152 580 147 585
          C 143 590 143 597 147 602
          C 152 608 150 616 143 617
          C 137 618 133 612 134 605
          C 135 597 132 590 133 582
          C 134 573 133 564 137 560 Z"/>
        <!-- Coronado island -->
        <path class="coronado" d="
          M 143 588
          C 148 583 156 584 158 590
          C 160 596 155 602 149 602
          C 143 602 140 594 143 588 Z"/>
        <!-- Coronado bridge -->
        <path class="bridge" d="M 156 588 C 159 582 163 580 166 582" fill="none"/>
        <!-- Mission Bay squiggle -->
        <path class="bay-water" d="
          M 131 542
          C 136 538 142 540 142 545
          C 142 550 136 552 132 549
          C 129 547 129 544 131 542 Z"/>
        <!-- the airport: one little runway by the bay -->
        <g class="airport" transform="translate(146,560) rotate(-24)">
          <rect x="-4.5" y="-0.9" width="9" height="1.8" rx="0.9"/>
          <line x1="-2.8" y1="0" x2="-1" y2="0"/>
          <line x1="0.6" y1="0" x2="2.4" y2="0"/>
        </g>
        <!-- downtown towers -->
        <g class="city city-fine" transform="translate(160,575)">
          <rect x="-4.4" y="-6" width="2.8" height="6" rx="1"/>
          <rect x="-0.6" y="-8.4" width="3" height="8.4" rx="1"/>
          <rect x="3.2" y="-5" width="2.6" height="5" rx="1"/>
        </g>
        <!-- Balboa Park: green with a little dome -->
        <g class="park" transform="translate(168,552)">
          <ellipse rx="9" ry="6.4" class="lawn"/>
          <g transform="translate(-3,1)"><line x1="0" y1="0" x2="0" y2="-2.4" class="trunk"/><circle cy="-4" r="2" class="leaves"/></g>
          <g transform="translate(4,2)"><line x1="0" y1="0" x2="0" y2="-2" class="trunk"/><circle cy="-3.4" r="1.7" class="leaves"/></g>
          <g class="dome" transform="translate(2,-3)">
            <rect x="-1.6" y="-2" width="3.2" height="2" rx="0.6"/>
            <path d="M -1.8 -2 A 1.8 1.8 0 0 1 1.8 -2 Z"/>
          </g>
        </g>
        <!-- UCSD: the library tower on its hill -->
        <g class="ucsd" transform="translate(135.5,508) scale(0.8)">
          <line x1="0" y1="3" x2="0" y2="-1.6"/>
          <path d="M -4.4 -1.6 C -5.4 -4.8 -3.6 -7.6 0 -7.6 C 3.6 -7.6 5.4 -4.8 4.4 -1.6 Z"/>
          <line x1="-3.2" y1="-3.6" x2="3.2" y2="-3.6"/>
          <line x1="-3.7" y1="-5.4" x2="3.7" y2="-5.4"/>
        </g>
        <!-- La Jolla cove seal -->
        <path class="seal" d="M 130.8 519.2 C 131.6 518.4 132.7 518.6 133 519.5 C 132.4 520 131.3 520 130.8 519.2 Z"/>
        <g class="waves waves-fine">
          <path d="M 118 500 q 3.5 -3 7 0 q 3.5 3 7 0"/>
          <path d="M 114 545 q 3.5 -3 7 0 q 3.5 3 7 0"/>
          <path d="M 120 605 q 3.5 -3 7 0 q 3.5 3 7 0"/>
          <path d="M 128 640 q 3.5 -3 7 0 q 3.5 3 7 0"/>
        </g>
        <text class="maplabel label-fine" x="133" y="503">La Jolla</text>
        <text class="maplabel label-fine" x="177" y="546">Balboa Park</text>
        <text class="maplabel label-fine" x="150" y="609">Coronado</text>
        <text class="maplabel label-fine" x="166" y="583">downtown</text>
        <text class="maplabel label-fine" x="136" y="628">Point Loma</text>
      </g>

      <!-- ═══════ CLOUDS (drift forever) ═══════ -->
      <g id="clouds">
        <g class="cloud cloud-a" transform="translate(320,150) scale(2.6)">
          <path d="M -18 0 A 8 8 0 0 1 -6 -8 A 9 9 0 0 1 8 -6 A 7 7 0 0 1 18 0 Z"/></g>
        <g class="cloud cloud-b" transform="translate(540,110) scale(1.9)">
          <path d="M -18 0 A 8 8 0 0 1 -6 -8 A 9 9 0 0 1 8 -6 A 7 7 0 0 1 18 0 Z"/></g>
        <g class="cloud cloud-c" transform="translate(680,260) scale(2.2)">
          <path d="M -18 0 A 8 8 0 0 1 -6 -8 A 9 9 0 0 1 8 -6 A 7 7 0 0 1 18 0 Z"/></g>
        <g class="cloud cloud-b" transform="translate(400,540) scale(1.6)">
          <path d="M -18 0 A 8 8 0 0 1 -6 -8 A 9 9 0 0 1 8 -6 A 7 7 0 0 1 18 0 Z"/></g>
        <g class="cloud cloud-a cloud-small" transform="translate(112,470) scale(0.5)">
          <path d="M -18 0 A 8 8 0 0 1 -6 -8 A 9 9 0 0 1 8 -6 A 7 7 0 0 1 18 0 Z"/></g>
        <g class="cloud cloud-c cloud-small" transform="translate(185,620) scale(0.42)">
          <path d="M -18 0 A 8 8 0 0 1 -6 -8 A 9 9 0 0 1 8 -6 A 7 7 0 0 1 18 0 Z"/></g>
        <g class="cloud cloud-b cloud-small" transform="translate(70,330) scale(0.7)">
          <path d="M -18 0 A 8 8 0 0 1 -6 -8 A 9 9 0 0 1 8 -6 A 7 7 0 0 1 18 0 Z"/></g>
      </g>

      <!-- JS fills these -->
      <g id="routes"></g>
      <g id="fx"></g>
      <g id="pins"></g>

      <!-- the plane (flight.js drives it) -->
      <g id="plane" class="plane-hidden">
        <g class="plane-inner">
          <path class="plane-body" d="M 14 0 L -12 9 L -4 1.5 L -12 -6 L -7 -7.5 Z"/>
          <path class="plane-fold" d="M 14 0 L -4 1.5 L -12 9 Z"/>
        </g>
      </g>
    </g>
  </svg>

  <!-- paper grain + soft vignette over the whole stage -->
  <div id="grain" aria-hidden="true"></div>
  <div id="vignette" aria-hidden="true"></div>

  <!-- progress dots -->
  <nav id="progress" aria-label="journey progress"></nav>

  <!-- compass rose (tap me five times…) -->
  <button id="compass" aria-label="compass rose">
    <svg viewBox="-24 -24 48 48">
      <circle r="21" class="compass-face"/>
      <path class="compass-star" d="M 0 -17 L 3.4 -3.4 L 17 0 L 3.4 3.4 L 0 17 L -3.4 3.4 L -17 0 L -3.4 -3.4 Z"/>
      <path class="compass-star-minor" d="M 0 -9 L 2 -2 L 9 0 L 2 2 L 0 9 L -2 2 L -9 0 L -2 -2 Z"/>
      <circle r="2.2" class="compass-hub"/>
      <text x="0" y="-12.5" class="compass-n">N</text>
    </svg>
  </button>

  <!-- passport stamp -->
  <div id="stamp" class="hidden" aria-hidden="true">
    <span class="stamp-sub">✈ ARRIVALS</span>
    <span class="stamp-city">PALERMO</span>
    <span class="stamp-date"></span>
  </div>

  <!-- memory card sheet -->
  <section id="card" class="card-hidden" aria-live="polite">
    <div class="grip" id="card-grip"><span></span></div>
    <div class="card-scroll" id="card-scroll">
      <figure class="card-photo">
        <img id="card-img" alt="" width="800" height="600" decoding="async">
        <figcaption id="card-caption"></figcaption>
      </figure>
      <p class="card-meta"><span id="card-place"></span><span class="meta-dot">·</span><span id="card-date"></span></p>
      <h2 id="card-title"></h2>
      <p id="card-body"></p>
    </div>
  </section>

  <!-- nav controls -->
  <div id="controls">
    <button id="btn-back" aria-label="previous chapter">‹</button>
    <button id="btn-next"><span id="btn-next-label">Next</span><span class="chev">›</span></button>
  </div>

  <!-- little hearts for the easter egg -->
  <div id="hearts" aria-hidden="true"></div>

  <!-- ═══════ TITLE SCREEN ═══════ -->
  <div id="title-screen">
    <div class="title-inner">
      <p class="title-eyebrow">a little map, made for</p>
      <h1 id="title-name"></h1>
      <div class="title-rule"><span>♥</span></div>
      <p id="title-line"></p>
      <button id="btn-begin" class="btn-primary">Begin</button>
      <div id="resume-box" class="hidden">
        <button id="btn-continue" class="btn-primary">Continue where you left off</button>
        <button id="btn-restart" class="btn-ghost">Start from the beginning</button>
      </div>
    </div>
  </div>

  <!-- ═══════ CLOSING SCREEN ═══════ -->
  <div id="closing" class="hidden">
    <button id="btn-closing-back" class="btn-ghost closing-back">‹ back to the map</button>
    <div class="closing-inner">
      <h2 id="closing-title"></h2>
      <p id="closing-message"></p>
      <p class="countdown-label" id="countdown-label"></p>
      <div id="countdown">
        <div class="cd-cell"><b id="cd-d">–</b><span>days</span></div>
        <div class="cd-cell"><b id="cd-h">–</b><span>hours</span></div>
        <div class="cd-cell"><b id="cd-m">–</b><span>min</span></div>
        <div class="cd-cell"><b id="cd-s">–</b><span>sec</span></div>
      </div>
