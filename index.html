        <button id="btn-restart" class="btn-ghost">Start from the beginning</button>
      </div>
    </div>
  </div>

  <!-- ═══════ CLOSING SCREEN ═══════ -->
  <div id="closing" class="hidden">
    <button id="btn-closing-back" class="btn-ghost closing-back">‹ back to the map</button>
    <div class="closing-inner">
      <h2 id="closing-title"></h2>
      <p id="closing-message"></p>
      <p class="countdown-label" id="countdown-label"></p>
      <div id="countdown">
        <div class="cd-cell"><b id="cd-d">–</b><span>days</span></div>
        <div class="cd-cell"><b id="cd-h">–</b><span>hours</span></div>
        <div class="cd-cell"><b id="cd-m">–</b><span>min</span></div>
        <div class="cd-cell"><b id="cd-s">–</b><span>sec</span></div>
      </div>
      <div id="clocks">
        <div class="clock"><span class="clock-city" id="clock-her-city"></span><b id="clock-her-time">–</b><span class="clock-tz" id="clock-her-tz"></span></div>
        <div class="clock-heart">♥</div>
        <div class="clock"><span class="clock-city" id="clock-my-city"></span><b id="clock-my-time">–</b><span class="clock-tz" id="clock-my-tz"></span></div>
      </div>
      <a id="btn-reply" class="btn-primary" href="#">Reply</a>
      <button id="btn-again" class="btn-ghost">walk it again ↺</button>
      <!-- Map data attribution. OpenStreetMap is ODbL-licensed and
           requires this credit; Natural Earth is public domain. -->
      <p class="attribution">coastlines © OpenStreetMap contributors · Natural Earth</p>
    </div>
  </div>

</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
